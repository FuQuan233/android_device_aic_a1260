# Station-only bring-up. Regulatory domain is supplied by Android, not fixed
# to a country code in the image. No network credentials are built in.
disable_scan_offload=1
p2p_disabled=1
# Retain STA operation across suspend and wake on the real AHB HIF IRQ.
# No packet-pattern or GTK rekey offload is advertised by this port.
wowlan_triggers=any
